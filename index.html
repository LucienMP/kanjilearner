<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字 Kanji Learner</title>
  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --border: #c8c8c8;
      --bg-card: #fff;
      --bg-page: #f0f0f0;
      --text: #222;
      --muted: #666;
      --accent: #1a56db;
      --guide: #d8d8d8;
      --font-kanji: "Noto Serif JP", "Yu Mincho", "MS Mincho", "HiraMinProN-W3", serif;
    }

    /* ── Base ────────────────────────────────────────────── */
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--text);
      font-size: 14px;
    }

    /* ── Screen-only controls bar ───────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .controls h1 {
      font-size: 1.2rem;
      margin-right: auto;
      white-space: nowrap;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
    }

    .controls select {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #eee; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover { background: #1648c0; }

    /* ── Page wrapper ───────────────────────────────────── */
    .page {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* ── Section heading ────────────────────────────────── */
    .section-heading {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      border-bottom: 2px solid var(--text);
      padding-bottom: 4px;
      margin-bottom: 16px;
    }

    /* ── Kanji grid ─────────────────────────────────────── */
    .kanji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    /* ── Kanji card ─────────────────────────────────────── */
    .kanji-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 8px 8px;
      text-align: center;
    }

    .kanji-char {
      font-family: var(--font-kanji);
      font-size: 3.6rem;
      line-height: 1.1;
      color: #111;
    }

    .kanji-readings {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .kanji-readings .label {
      font-weight: 600;
      color: var(--text);
    }

    .kanji-meaning {
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      min-height: 1.2em;
    }

    /* ── Practice boxes ─────────────────────────────────── */
    .practice-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
    }

    .practice-box {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: #fafafa;
      position: relative;
      flex-shrink: 0;
    }

    /* Crosshair guide lines */
    .practice-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(var(--guide) 1px, transparent 1px),
        linear-gradient(90deg, var(--guide) 1px, transparent 1px);
      background-size: 50% 50%;
      background-position: 50% 50%;
    }

    /* ════════════════════════════════════════════════════
       Print styles — everything below is print-only
       ════════════════════════════════════════════════════ */
    @media print {
      body { background: #fff; }

      .controls { display: none; }

      .page {
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .section-heading { margin-top: 0; }

      .kanji-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .kanji-card {
        border-radius: 4px;
        page-break-inside: avoid;
        break-inside: avoid;
        padding: 6px 4px;
      }

      .kanji-char { font-size: 2.8rem; }

      .kanji-readings { font-size: 0.7rem; }

      .kanji-meaning { font-size: 0.78rem; }

      .practice-box { width: 28px; height: 28px; }
    }
  </style>
</head>
<body>

<!-- ── Controls (hidden when printing) ──────────────────── -->
<div class="controls" id="controls">
  <h1>漢字 Kanji Learner</h1>

  <label for="levelSelect">Level:</label>
  <select id="levelSelect">
    <option value="n5">JLPT N5</option>
    <option value="n4">JLPT N4</option>
    <option value="both">N5 + N4</option>
  </select>

  <label>
    <input type="checkbox" id="showPractice" checked>
    Practice boxes
  </label>

  <label>
    <input type="checkbox" id="hideMeaning">
    Hide meanings (quiz)
  </label>

  <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
</div>

<!-- ── Main content ──────────────────────────────────────── -->
<div class="page" id="page">
  <div id="kanjiContainer"></div>
</div>

  /* ── Render ─────────────────────────────────────────────── */
  function render() {
    const level       = document.getElementById("levelSelect").value;
    const showPractice = document.getElementById("showPractice").checked;
    const hideMeaning  = document.getElementById("hideMeaning").checked;

    let groups;
    if (level === "both") {
      groups = [
        { label: "JLPT N5", kanji: KANJI.n5 },
        { label: "JLPT N4", kanji: KANJI.n4 },
      ];
    } else {
      groups = [
        { label: `JLPT ${level.toUpperCase()}`, kanji: KANJI[level] },
      ];
    }

    document.getElementById("kanjiContainer").innerHTML = groups.map(g => `
      <div class="section-heading">${g.label} — ${g.kanji.length} kanji</div>
      <div class="kanji-grid" style="margin-bottom:24px">
        ${g.kanji.map(k => cardHTML(k, showPractice, hideMeaning)).join("")}
      </div>
    `).join("");
  }

  function cardHTML(k, showPractice, hideMeaning) {
    const practiceRow = showPractice ? `
      <div class="practice-row">
        <div class="practice-box"></div>
        <div class="practice-box"></div>
        <div class="practice-box"></div>
        <div class="practice-box"></div>
      </div>` : "";

    const meaning = hideMeaning
      ? `<div class="kanji-meaning">&nbsp;</div>`
      : `<div class="kanji-meaning">${escHtml(k.meaning)}</div>`;

    return `
      <div class="kanji-card">
        <div class="kanji-char">${escHtml(k.char)}</div>
        <div class="kanji-readings">
          <span class="label">音</span> ${escHtml(k.on)}<br>
          <span class="label">訓</span> ${escHtml(k.kun)}
        </div>
        ${meaning}
        ${practiceRow}
      </div>`;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /* ── Event wiring ───────────────────────────────────────── */
  document.getElementById("levelSelect").addEventListener("change", render);
  document.getElementById("showPractice").addEventListener("change", render);
  document.getElementById("hideMeaning").addEventListener("change", render);

  render();
</script>
</body>
